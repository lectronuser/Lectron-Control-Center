# Builds the Linux AppImage on Ubuntu 22.04. An AppImage built against the older glibc of 22.04 also runs on 24.04,
# so one file covers both. Run it from the Actions tab ("Run workflow") or by pushing a tag like v1.0.0; the
# AppImage is under the run's artifacts and, for a tag, attached to the GitHub release.
name: Linux build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev file binutils

      # the same Flutter as on the development machine
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Build the AppImage
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          bash tool/build_appimage.sh
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          mv "build/LectronControlCenter-${version}-x86_64.AppImage" "LectronControlCenter-${version}-linux-x86_64.AppImage"

      # 22.04 has glibc 2.35: anything newer would keep the AppImage from starting there
      - name: Check the glibc it needs
        run: |
          need=$(objdump -T build/linux/x64/release/bundle/lectron_control_center build/linux/x64/release/bundle/lib/*.so \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "needs $need"
          [ "$(printf '%s\nGLIBC_2.35\n' "$need" | sort -V | tail -1)" = "GLIBC_2.35" ]

      # start it on a clean 24.04 with a virtual screen, to be sure it runs there too
      - name: Start on Ubuntu 24.04
        run: |
          docker run --rm -v "$PWD:/app:ro" ubuntu:24.04 bash -c '
            apt-get update -qq >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgtk-3-0 xvfb xauth libgl1 libegl1 >/dev/null
            cd /tmp
            (xvfb-run -a /app/LectronControlCenter-*-linux-x86_64.AppImage --appimage-extract-and-run > run.txt 2>&1 &)
            sleep 15
            if pgrep -f lectron_control_center >/dev/null; then echo "runs on 24.04"; else cat run.txt; exit 1; fi'

      - uses: actions/upload-artifact@v4
        with:
          name: LectronControlCenter-linux-x86_64
          path: LectronControlCenter-*-linux-x86_64.AppImage

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LectronControlCenter-*-linux-x86_64.AppImage
