# Builds the Windows app on a GitHub Windows machine (Flutter builds Windows apps only on Windows, with MSVC).
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v1.0.0; the zip is under the run's
# artifacts and, for a tag, attached to the GitHub release.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # the same Flutter as on the development machine
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release --no-tree-shake-icons

      # the exe needs the DLLs and the data folder next to it, so the whole Release folder is shipped
      - name: Zip
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "LectronControlCenter-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: LectronControlCenter-windows-x64
          path: LectronControlCenter-*-windows-x64.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LectronControlCenter-*-windows-x64.zip
